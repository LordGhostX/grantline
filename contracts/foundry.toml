[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read-write", path = "./cache" },
    { access = "read-write", path = "./deployments" }
]

[rpc_endpoints]
xlayer_testnet = "${XLAYER_TESTNET_RPC_URL}"
